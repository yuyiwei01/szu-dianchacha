name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check frontend syntax and statistics
        shell: pwsh
        run: |
          node --check web/app.js
          node --check web/chart.js
          node --test tests/model.test.mjs
      - name: Check SIMS parser with synthetic fixtures
        shell: powershell
        run: ./tests/query.test.ps1
      - name: Build portable Windows application
        shell: powershell
        run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: SZU-Dianchacha-Windows
          path: dist/*
          if-no-files-found: error

